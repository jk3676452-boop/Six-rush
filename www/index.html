<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SixRush — Mohalla Cricket Scorer</title>

  <!-- Athletic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Production Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            graphite: {
              950: '#07090D',
              900: '#0B0E14',
              850: '#111622',
              800: '#17202F',
              700: '#233044',
              600: '#33435C',
            },
            lime: {
              400: '#1CE664',
              500: '#00FF66',
              glow: 'rgba(0, 255, 102, 0.25)',
            },
            accent: {
              red: '#FF334B',
              gold: '#FFB800',
              blue: '#0A84FF',
            }
          },
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['Chakra Petch', 'monospace'],
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #07090D;
      color: #F3F4F6;
      font-family: 'Space Grotesk', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .score-digits {
      font-family: 'Chakra Petch', monospace;
      font-variant-numeric: tabular-nums;
    }
    .active-press:active {
      transform: scale(0.95);
      transition: transform 0.05s ease-out;
    }
    /* Hide scrollbars for clean native app feel */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-graphite-950 text-gray-100 flex flex-col justify-between min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useReducer } = React;

    // Vibration feedback for mobile
    const hapticTap = (ms = 20) => {
      if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(ms);
    };

    // Private Local Database Key
    const DB_STORAGE_KEY = 'SIXRUSH_PLAYSTORE_LOCAL_DATA_V1';

    // Demo Data Seed
    const DEFAULT_MATCH = {
      id: 'match-' + Date.now(),
      title: 'Sunday Mohalla Championship',
      venue: 'Gully Stadium Pitch',
      date: 'Today',
      totalOvers: 6,
      playersPerSide: 7,
      maxOversPerBowler: 2,
      teamA: {
        name: 'Royal Strikers',
        players: ['Sameer (C)', 'Rohan (wk)', 'Dev', 'Zaid', 'Farhan', 'Bunty', 'Aman']
      },
      teamB: {
        name: 'Gully Titans',
        players: ['Sunny (C)', 'Imran', 'Danish (wk)', 'Arjun', 'Manish', 'Karan', 'Bilal']
      },
      toss: { winner: 'Royal Strikers', choice: 'Bat' },
      currentInning: 1,
      target: null,
      isCompleted: false,
      winner: null,
      isDemo: true,
      innings: [
        {
          teamBatting: 'Royal Strikers',
          teamBowling: 'Gully Titans',
          totalRuns: 42,
          wickets: 2,
          legalBalls: 20, // 3.2 overs
          extras: { wides: 3, noBalls: 1, byes: 0, legByes: 0 },
          currentStriker: 'Sameer (C)',
          currentNonStriker: 'Dev',
          currentBowler: 'Sunny (C)',
          battingStats: {
            'Sameer (C)': { runs: 24, balls: 11, fours: 3, sixes: 1, howOut: 'not out', isOut: false },
            'Rohan (wk)': { runs: 10, balls: 6, fours: 2, sixes: 0, howOut: 'c Manish b Arjun', isOut: true },
            'Zaid': { runs: 4, balls: 3, fours: 0, sixes: 0, howOut: 'b Sunny', isOut: true },
            'Dev': { runs: 4, balls: 2, fours: 0, sixes: 0, howOut: 'not out', isOut: false }
          },
          bowlingStats: {
            'Sunny (C)': { overs: 1, balls: 2, runs: 16, wickets: 1, wides: 1, noBalls: 0 },
            'Arjun': { overs: 2, balls: 0, runs: 24, wickets: 1, wides: 2, noBalls: 1 }
          },
          fallOfWickets: [
            { score: 18, wicket: 1, batter: 'Rohan (wk)', over: '1.4' },
            { score: 32, wicket: 2, batter: 'Zaid', over: '2.5' }
          ],
          ballLog: [
            { over: 3, ball: 2, runs: 1, type: 'RUN', desc: 'Dev pushes to cover for 1' },
            { over: 3, ball: 1, runs: 4, type: 'RUN', desc: 'Sameer pulls away for FOUR!' },
            { over: 2, ball: 6, runs: 0, type: 'DOT', desc: 'Solid defensive block' },
            { over: 2, ball: 5, runs: 0, type: 'WICKET', desc: 'Clean bowled! Zaid walks back' }
          ]
        },
        {
          teamBatting: 'Gully Titans',
          teamBowling: 'Royal Strikers',
          totalRuns: 0,
          wickets: 0,
          legalBalls: 0,
          extras: { wides: 0, noBalls: 0, byes: 0, legByes: 0 },
          currentStriker: '',
          currentNonStriker: '',
          currentBowler: '',
          battingStats: {},
          bowlingStats: {},
          fallOfWickets: [],
          ballLog: []
        }
      ]
    };

    function SixRushApp() {
      // Views: 'home' | 'scorer' | 'setup' | 'scorecard' | 'tournament'
      const [view, setView] = useState('scorer');
      const [matches, setMatches] = useState(() => {
        try {
          const stored = localStorage.getItem(DB_STORAGE_KEY);
          return stored ? JSON.parse(stored) : [DEFAULT_MATCH];
        } catch(e) {
          return [DEFAULT_MATCH];
        }
      });
      const [activeMatchId, setActiveMatchId] = useState(matches[0]?.id || DEFAULT_MATCH.id);
      const [toast, setToast] = useState(null);

      // Modals
      const [wicketModalOpen, setWicketModalOpen] = useState(false);
      const [bowlerModalOpen, setBowlerModalOpen] = useState(false);
      const [wicketForm, setWicketForm] = useState({ type: 'Bowled', outPlayer: '', newBatter: '' });

      // Save on every ball automatically
      useEffect(() => {
        try {
          localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(matches));
        } catch(e) {}
      }, [matches]);

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2800);
      };

      const match = useMemo(() => {
        return matches.find(m => m.id === activeMatchId) || matches[0];
      }, [matches, activeMatchId]);

      const inning = useMemo(() => {
        return match.innings[match.currentInning - 1];
      }, [match]);

      const formatOvers = (balls) => {
        const ov = Math.floor(balls / 6);
        const rem = balls % 6;
        return `${ov}.${rem}`;
      };

      // CRICKET SCORING CALCULATION CORE
      const recordDelivery = (event) => {
        hapticTap(25);
        if (match.isCompleted) {
          triggerToast('Match complete ho chuka hai!');
          return;
        }

        setMatches(prev => prev.map(m => {
          if (m.id !== activeMatchId) return m;
          const clone = JSON.parse(JSON.stringify(m));
          const inn = clone.innings[clone.currentInning - 1];

          const striker = inn.currentStriker;
          const bowler = inn.currentBowler;

          if (!striker || !bowler) {
            triggerToast('Striker ya bowler select karein!');
            return clone;
          }

          if (!inn.battingStats[striker]) {
            inn.battingStats[striker] = { runs: 0, balls: 0, fours: 0, sixes: 0, howOut: 'not out', isOut: false };
          }
          if (!inn.bowlingStats[bowler]) {
            inn.bowlingStats[bowler] = { overs: 0, balls: 0, maidens: 0, runs: 0, wickets: 0, wides: 0, noBalls: 0 };
          }

          const runsScored = event.runs || 0;
          const isLegal = event.isLegal !== false;

          // Update stats
          if (event.type === 'RUN' || event.type === 'DOT') {
            inn.battingStats[striker].runs += runsScored;
            inn.battingStats[striker].balls += 1;
            if (runsScored === 4) inn.battingStats[striker].fours += 1;
            if (runsScored === 6) {
              inn.battingStats[striker].sixes += 1;
              hapticTap(60);
            }
            inn.bowlingStats[bowler].runs += runsScored;
            inn.totalRuns += runsScored;
            inn.legalBalls += 1;
          } else if (event.type === 'WD') {
            inn.extras.wides += 1;
            inn.totalRuns += 1;
            inn.bowlingStats[bowler].runs += 1;
            inn.bowlingStats[bowler].wides += 1;
          } else if (event.type === 'NB') {
            inn.extras.noBalls += 1;
            inn.totalRuns += 1;
            inn.bowlingStats[bowler].runs += 1;
            inn.bowlingStats[bowler].noBalls += 1;
          } else if (event.type === 'BYE') {
            inn.extras.byes += runsScored;
            inn.totalRuns += runsScored;
            inn.battingStats[striker].balls += 1;
            inn.legalBalls += 1;
          } else if (event.type === 'LB') {
            inn.extras.legByes += runsScored;
            inn.totalRuns += runsScored;
            inn.battingStats[striker].balls += 1;
            inn.legalBalls += 1;
          }

          // Recalculate Bowler's official overs
          const bBalls = inn.ballLog.filter(b => b.bowler === bowler && b.isLegal).length + (isLegal ? 1 : 0);
          inn.bowlingStats[bowler].overs = Math.floor(bBalls / 6);
          inn.bowlingStats[bowler].balls = bBalls % 6;

          // Ball Log entry
          inn.ballLog.unshift({
            over: Math.floor((inn.legalBalls - (isLegal ? 1 : 0)) / 6),
            ball: isLegal ? ((inn.legalBalls - 1) % 6) + 1 : (inn.legalBalls % 6),
            type: event.type,
            runs: runsScored,
            isLegal,
            striker,
            bowler,
            desc: event.type === 'WD' ? 'Wide delivery' : event.type === 'NB' ? 'No Ball' : `${striker} scored ${runsScored} run(s)`
          });

          // Strike rotation on 1, 3, 5 runs
          if (runsScored % 2 !== 0 && event.type !== 'WD') {
            const temp = inn.currentStriker;
            inn.currentStriker = inn.currentNonStriker;
            inn.currentNonStriker = temp;
          }

          // Over finish check
          if (isLegal && inn.legalBalls % 6 === 0) {
            // Batsmen rotate ends
            const temp = inn.currentStriker;
            inn.currentStriker = inn.currentNonStriker;
            inn.currentNonStriker = temp;
            setTimeout(() => setBowlerModalOpen(true), 250);
          }

          // Target chase check (2nd innings)
          if (clone.currentInning === 2 && clone.target && inn.totalRuns >= clone.target) {
            clone.isCompleted = true;
            const wktsLeft = (clone.playersPerSide - 1) - inn.wickets;
            clone.winner = `${inn.teamBatting} won by ${wktsLeft} wicket(s)! 🏆`;
            triggerToast(clone.winner);
          }

          // Max overs completed check
          if (inn.legalBalls >= clone.totalOvers * 6) {
            if (clone.currentInning === 1) {
              clone.target = inn.totalRuns + 1;
              clone.currentInning = 2;
              triggerToast(`1st Innings Finish! Target: ${clone.target}`);
            } else {
              clone.isCompleted = true;
              if (inn.totalRuns >= clone.target) {
                clone.winner = `${inn.teamBatting} won! 🏆`;
              } else if (inn.totalRuns === clone.target - 1) {
                clone.winner = 'Match Tied! (Super Over)';
              } else {
                const diff = (clone.target - 1) - inn.totalRuns;
                clone.winner = `${clone.innings[0].teamBatting} won by ${diff} runs! 🏆`;
              }
              triggerToast(clone.winner);
            }
          }

          return clone;
        }));
      };

      // Wicket Execution
      const confirmDismissal = () => {
        hapticTap(80);
        setMatches(prev => prev.map(m => {
          if (m.id !== activeMatchId) return m;
          const clone = JSON.parse(JSON.stringify(m));
          const inn = clone.innings[clone.currentInning - 1];

          const outName = wicketForm.outPlayer || inn.currentStriker;

          if (inn.battingStats[outName]) {
            inn.battingStats[outName].isOut = true;
            inn.battingStats[outName].howOut = `${wicketForm.type} b ${inn.currentBowler}`;
            inn.battingStats[outName].balls += 1;
          }

          if (inn.bowlingStats[inn.currentBowler] && wicketForm.type !== 'Run Out') {
            inn.bowlingStats[inn.currentBowler].wickets += 1;
          }

          inn.wickets += 1;
          inn.legalBalls += 1;

          inn.fallOfWickets.push({
            score: inn.totalRuns,
            wicket: inn.wickets,
            batter: outName,
            over: formatOvers(inn.legalBalls)
          });

          // Replace dismissed batsman
          const replacement = wicketForm.newBatter || ('Player ' + (inn.wickets + 2));
          if (outName === inn.currentStriker) {
            inn.currentStriker = replacement;
          } else {
            inn.currentNonStriker = replacement;
          }

          inn.battingStats[replacement] = { runs: 0, balls: 0, fours: 0, sixes: 0, howOut: 'not out', isOut: false };

          inn.ballLog.unshift({
            over: Math.floor((inn.legalBalls - 1) / 6),
            ball: ((inn.legalBalls - 1) % 6) + 1,
            type: 'WICKET',
            runs: 0,
            isLegal: true,
            striker: outName,
            bowler: inn.currentBowler,
            desc: `WICKET! ${outName} (${wicketForm.type})`
          });

          // All out check
          if (inn.wickets >= (clone.playersPerSide - 1)) {
            triggerToast('All Out!');
            if (clone.currentInning === 1) {
              clone.target = inn.totalRuns + 1;
              clone.currentInning = 2;
            } else {
              clone.isCompleted = true;
              const diff = (clone.target - 1) - inn.totalRuns;
              clone.winner = `${clone.innings[0].teamBatting} won by ${diff} runs! 🏆`;
            }
          }

          return clone;
        }));
        setWicketModalOpen(false);
      };

      // Undo Feature
      const undoLastBall = () => {
        hapticTap(30);
        setMatches(prev => prev.map(m => {
          if (m.id !== activeMatchId) return m;
          const clone = JSON.parse(JSON.stringify(m));
          const inn = clone.innings[clone.currentInning - 1];

          if (!inn.ballLog || inn.ballLog.length === 0) {
            triggerToast('No delivery to undo');
            return clone;
          }

          const last = inn.ballLog.shift();
          if (last.isLegal) inn.legalBalls = Math.max(0, inn.legalBalls - 1);
          inn.totalRuns = Math.max(0, inn.totalRuns - last.runs - (last.type === 'WD' || last.type === 'NB' ? 1 : 0));

          if (last.type === 'WD') inn.extras.wides = Math.max(0, inn.extras.wides - 1);
          if (last.type === 'NB') inn.extras.noBalls = Math.max(0, inn.extras.noBalls - 1);
          if (last.type === 'BYE') inn.extras.byes = Math.max(0, inn.extras.byes - last.runs);
          if (last.type === 'LB') inn.extras.legByes = Math.max(0, inn.extras.legByes - last.runs);

          if (last.type === 'WICKET') {
            inn.wickets = Math.max(0, inn.wickets - 1);
            inn.fallOfWickets.pop();
          }

          clone.isCompleted = false;
          clone.winner = null;
          triggerToast('Delivery reverted (Undo)');
          return clone;
        }));
      };

      // WhatsApp Share
      const shareScorecard = () => {
        const inn1 = match.innings[0];
        const text = `🏏 *SIXRUSH MOHALLA CRICKET* 🏏\n*${match.title}*\n${inn1.teamBatting}: ${inn1.totalRuns}/${inn1.wickets} (${formatOvers(inn1.legalBalls)}/${match.totalOvers} ov)\nResult: ${match.winner || 'Match Live!'}\n\nScored on SixRush App ⚡`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      };

      // Helpers
      const crr = inning.legalBalls > 0 ? ((inning.totalRuns / inning.legalBalls) * 6).toFixed(2) : '0.00';
      const remainingBalls = (match.totalOvers * 6) - inning.legalBalls;
      const rrr = match.target && remainingBalls > 0 ? (((match.target - inning.totalRuns) / remainingBalls) * 6).toFixed(2) : '0.00';

      const sStats = inning.battingStats[inning.currentStriker] || { runs: 0, balls: 0, fours: 0, sixes: 0 };
      const nsStats = inning.battingStats[inning.currentNonStriker] || { runs: 0, balls: 0, fours: 0, sixes: 0 };
      const bStats = inning.bowlingStats[inning.currentBowler] || { overs: 0, balls: 0, runs: 0, wickets: 0 };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-graphite-950 flex flex-col justify-between border-x border-graphite-800 shadow-2xl relative">

          {/* TOP APP BAR */}
          <header className="px-4 py-3 bg-graphite-900 border-b border-graphite-800 flex justify-between items-center sticky top-0 z-20">
            <div className="flex items-center space-x-2.5" onClick={() => setView('home')}>
              <div className="w-8 h-8 rounded-lg bg-lime-500 text-black flex items-center justify-center font-bold text-base score-digits shadow-[0_0_12px_rgba(0,255,102,0.35)]">
                6⚡
              </div>
              <div>
                <h1 className="font-bold text-sm tracking-tight text-white flex items-center">
                  Six<span className="text-lime-400">Rush</span>
                  {match.isDemo && <span className="ml-2 text-[9px] font-mono text-lime-400 bg-lime-500/10 px-1 rounded border border-lime-500/30">DEMO</span>}
                </h1>
                <p className="text-[10px] text-gray-400 font-mono">Mohalla Scorer Pro</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button onClick={undoLastBall} className="px-2.5 py-1 bg-graphite-800 border border-graphite-700 rounded-lg text-xs font-semibold text-gray-300 active-press">
                Undo ↩
              </button>
              <button onClick={shareScorecard} className="px-2.5 py-1 bg-lime-500/10 border border-lime-500/30 text-lime-400 rounded-lg text-xs font-bold active-press">
                Share 💬
              </button>
            </div>
          </header>

          {/* 1. SCORER VIEW */}
          {view === 'scorer' && (
            <main className="p-3 space-y-3 flex-1 overflow-y-auto">
              {/* BIG SCORE DISPLAY */}
              <div className="bg-gradient-to-b from-graphite-900 to-graphite-950 border border-graphite-700 rounded-3xl p-4 shadow-xl">
                <div className="flex justify-between items-center text-xs text-gray-400 border-b border-graphite-800 pb-2">
                  <span className="font-bold text-white uppercase truncate">{inning.teamBatting}</span>
                  <span className="font-mono text-lime-400 font-semibold">Innings {match.currentInning}</span>
                </div>

                <div className="flex items-baseline justify-between my-2">
                  <div className="flex items-baseline">
                    <span className="score-digits text-5xl font-extrabold text-white">{inning.totalRuns}</span>
                    <span className="score-digits text-3xl font-extrabold text-lime-400 ml-1">/{inning.wickets}</span>
                  </div>
                  <div className="text-right">
                    <span className="score-digits text-2xl font-bold text-gray-200">
                      {formatOvers(inning.legalBalls)} <span className="text-xs text-gray-400 font-normal">/{match.totalOvers} ov</span>
                    </span>
                    <div className="text-[11px] font-mono text-gray-400">CRR: <strong className="text-lime-400">{crr}</strong></div>
                  </div>
                </div>

                {match.target && (
                  <div className="p-2 bg-graphite-850 rounded-xl border border-graphite-700 flex justify-between items-center text-xs">
                    <span className="text-gray-300">Need <strong className="text-lime-400 font-mono">{Math.max(0, match.target - inning.totalRuns)}</strong> off <strong className="text-white font-mono">{remainingBalls}</strong> balls</span>
                    <span className="text-gray-400 font-mono">RRR: <strong className="text-accent-gold">{rrr}</strong></span>
                  </div>
                )}
              </div>

              {/* BATSMEN & BOWLER STATUS */}
              <div className="bg-graphite-900 border border-graphite-800 rounded-2xl p-3 space-y-2">
                <div className="flex justify-between items-center p-2 rounded-xl bg-graphite-850 border border-lime-500/30 text-xs">
                  <span className="font-bold text-white flex items-center">
                    <span className="w-2 h-2 rounded-full bg-lime-400 animate-pulse mr-1.5"></span>
                    {inning.currentStriker} *
                  </span>
                  <span className="font-mono text-lime-400 font-bold">{sStats.runs} <span className="text-gray-400 font-normal">({sStats.balls}b) 4s:{sStats.fours} 6s:{sStats.sixes}</span></span>
                </div>
                <div className="flex justify-between items-center p-2 rounded-xl bg-graphite-850 text-xs">
                  <span className="text-gray-300">{inning.currentNonStriker}</span>
                  <span className="font-mono text-gray-300">{nsStats.runs} <span className="text-gray-500">({nsStats.balls}b) 4s:{nsStats.fours} 6s:{nsStats.sixes}</span></span>
                </div>
                <div className="flex justify-between items-center pt-2 border-t border-graphite-800 text-xs">
                  <span className="text-gray-400">Bowler: <strong className="text-white">{inning.currentBowler}</strong></span>
                  <span className="font-mono text-gray-300">{bStats.overs}.{bStats.balls} ov • {bStats.runs}r • <strong className="text-accent-red font-bold">{bStats.wickets}w</strong></span>
                </div>
              </div>

              {/* SCORING KEYPAD */}
              <div className="space-y-2 pt-1">
                <div className="grid grid-cols-4 gap-2">
                  {[0, 1, 2, 3].map(r => (
                    <button key={r} onClick={() => recordDelivery({ type: r === 0 ? 'DOT' : 'RUN', runs: r })} className="py-3 bg-graphite-850 hover:bg-graphite-800 border border-graphite-700 rounded-2xl score-digits font-bold text-xl text-white active-press">
                      {r}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <button onClick={() => recordDelivery({ type: 'RUN', runs: 4 })} className="py-3.5 bg-lime-500/20 border border-lime-500 text-lime-400 font-mono font-extrabold text-xl rounded-2xl active-press">
                    4 FOUR
                  </button>
                  <button onClick={() => recordDelivery({ type: 'RUN', runs: 6 })} className="py-3.5 bg-accent-gold/20 border border-accent-gold text-accent-gold font-mono font-extrabold text-xl rounded-2xl active-press">
                    6 SIX ⚡
                  </button>
                  <button onClick={() => setWicketModalOpen(true)} className="py-3.5 bg-accent-red/20 border border-accent-red text-white font-mono font-extrabold text-lg rounded-2xl active-press">
                    OUT ✕
                  </button>
                </div>

                <div className="grid grid-cols-4 gap-2">
                  <button onClick={() => recordDelivery({ type: 'WD', isLegal: false })} className="py-2.5 bg-graphite-900 border border-yellow-500/40 text-yellow-400 font-mono text-xs rounded-xl font-bold active-press">
                    Wide (+1)
                  </button>
                  <button onClick={() => recordDelivery({ type: 'NB', isLegal: false })} className="py-2.5 bg-graphite-900 border border-orange-500/40 text-orange-400 font-mono text-xs rounded-xl font-bold active-press">
                    No-Ball (+1)
                  </button>
                  <button onClick={() => recordDelivery({ type: 'BYE', runs: 1 })} className="py-2.5 bg-graphite-900 border border-graphite-700 text-gray-300 font-mono text-xs rounded-xl active-press">
                    Bye (+1)
                  </button>
                  <button onClick={() => setBowlerModalOpen(true)} className="py-2.5 bg-graphite-900 border border-lime-500/40 text-lime-400 font-mono text-xs rounded-xl font-bold active-press">
                    Bowler ▾
                  </button>
                </div>
              </div>

              {/* RECENT BALL LOG */}
              <div className="bg-graphite-900 border border-graphite-800 rounded-2xl p-3">
                <span className="text-[10px] text-gray-400 font-mono uppercase font-bold block mb-2">Deliveries Timeline</span>
                <div className="flex space-x-2 overflow-x-auto py-1">
                  {inning.ballLog.slice(0, 8).map((b, i) => (
                    <div key={i} className={`w-8 h-8 rounded-full border flex items-center justify-center font-mono text-xs font-bold flex-shrink-0 ${b.type === 'WICKET' ? 'bg-accent-red text-white border-red-500' : b.runs === 4 ? 'bg-lime-500/20 text-lime-400 border-lime-500' : b.runs === 6 ? 'bg-accent-gold/20 text-accent-gold border-accent-gold' : 'bg-graphite-800 text-gray-200 border-graphite-700'}`}>
                      {b.type === 'WICKET' ? 'W' : b.type === 'WD' ? 'Wd' : b.type === 'NB' ? 'Nb' : b.runs}
                    </div>
                  ))}
                  {inning.ballLog.length === 0 && <span className="text-xs text-gray-500 italic">No balls yet</span>}
                </div>
              </div>
            </main>
          )}

          {/* 2. FULL SCORECARD VIEW */}
          {view === 'scorecard' && (
            <main className="p-3 space-y-3 flex-1 overflow-y-auto">
              <h2 className="text-base font-bold text-white border-b border-graphite-800 pb-2">Full Match Scorecard</h2>
              <div className="bg-graphite-900 rounded-2xl border border-graphite-800 p-3 space-y-2">
                <div className="text-xs font-mono text-lime-400 uppercase font-bold">Batting Statistics</div>
                {Object.entries(inning.battingStats).map(([name, s]) => (
                  <div key={name} className="flex justify-between items-center text-xs border-b border-graphite-850 pb-1">
                    <div>
                      <div className="font-semibold text-white">{name}</div>
                      <div className="text-[10px] text-gray-500">{s.howOut}</div>
                    </div>
                    <div className="font-mono text-lime-400 font-bold">{s.runs} <span className="text-gray-400 font-normal">({s.balls}b)</span></div>
                  </div>
                ))}
              </div>

              <div className="bg-graphite-900 rounded-2xl border border-graphite-800 p-3 space-y-2">
                <div className="text-xs font-mono text-lime-400 uppercase font-bold">Bowling Figures</div>
                {Object.entries(inning.bowlingStats).map(([name, s]) => (
                  <div key={name} className="flex justify-between items-center text-xs border-b border-graphite-850 pb-1">
                    <div className="font-semibold text-white">{name}</div>
                    <div className="font-mono text-gray-300">{s.overs}.{s.balls} ov • {s.runs}r • <strong className="text-accent-red font-bold">{s.wickets}w</strong></div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* 3. TOURNAMENT POINTS TABLE */}
          {view === 'tournament' && (
            <main className="p-3 space-y-3 flex-1 overflow-y-auto">
              <h2 className="text-base font-bold text-white border-b border-graphite-800 pb-2">Mohalla League Standings</h2>
              <div className="bg-graphite-900 rounded-2xl border border-graphite-800 overflow-hidden">
                <div className="grid grid-cols-6 p-2 bg-graphite-850 text-[10px] font-mono text-gray-400 uppercase">
                  <span className="col-span-3">Team</span>
                  <span className="text-center">P</span>
                  <span className="text-center">W</span>
                  <span className="text-right">PTS</span>
                </div>
                {[
                  { name: 'Royal Strikers', p: 3, w: 3, pts: 6 },
                  { name: 'Gully Titans', p: 3, w: 2, pts: 4 },
                  { name: 'Sector 4 Kings', p: 3, w: 1, pts: 2 },
                  { name: 'Young Stars', p: 3, w: 0, pts: 0 }
                ].map((t, idx) => (
                  <div key={idx} className="grid grid-cols-6 p-2.5 text-xs border-b border-graphite-850 items-center">
                    <span className="col-span-3 font-semibold text-white">{t.name}</span>
                    <span className="text-center font-mono text-gray-300">{t.p}</span>
                    <span className="text-center font-mono text-lime-400 font-bold">{t.w}</span>
                    <span className="text-right font-mono text-lime-400 font-bold text-sm">{t.pts}</span>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* BOTTOM NAVIGATION TABS */}
          <nav className="p-2 bg-graphite-900 border-t border-graphite-800 flex justify-around items-center sticky bottom-0 z-20">
            <button onClick={() => setView('scorer')} className={`text-xs flex flex-col items-center ${view === 'scorer' ? 'text-lime-400 font-bold' : 'text-gray-400'}`}>
              <span className="text-base">🏏</span>
              <span>Scorer</span>
            </button>
            <button onClick={() => setView('scorecard')} className={`text-xs flex flex-col items-center ${view === 'scorecard' ? 'text-lime-400 font-bold' : 'text-gray-400'}`}>
              <span className="text-base">📋</span>
              <span>Card</span>
            </button>
            <button onClick={() => setView('tournament')} className={`text-xs flex flex-col items-center ${view === 'tournament' ? 'text-lime-400 font-bold' : 'text-gray-400'}`}>
              <span className="text-base">🏆</span>
              <span>Points</span>
            </button>
          </nav>

          {/* WICKET MODAL */}
          {wicketModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-graphite-900 border border-graphite-700 w-full max-w-sm rounded-2xl p-4 space-y-3">
                <h3 className="font-bold text-accent-red text-base">Out! Dismissal Details</h3>
                <div className="grid grid-cols-3 gap-1.5 text-xs">
                  {['Bowled', 'Caught', 'Run Out', 'LBW', 'Stumped'].map(m => (
                    <button key={m} onClick={() => setWicketForm({ ...wicketForm, type: m })} className={`py-1.5 rounded border ${wicketForm.type === m ? 'bg-accent-red/20 border-accent-red text-white' : 'bg-graphite-800 border-graphite-700 text-gray-300'}`}>
                      {m}
                    </button>
                  ))}
                </div>
                <div>
                  <label className="text-[10px] text-gray-400">Incoming Batter Name</label>
                  <input type="text" placeholder="e.g. Farhan" value={wicketForm.newBatter} onChange={e => setWicketForm({ ...wicketForm, newBatter: e.target.value })} className="w-full bg-graphite-800 border border-graphite-700 rounded p-2 text-xs text-white" />
                </div>
                <div className="flex space-x-2 pt-2">
                  <button onClick={() => setWicketModalOpen(false)} className="flex-1 py-2 bg-graphite-800 rounded text-xs text-gray-400">Cancel</button>
                  <button onClick={confirmDismissal} className="flex-1 py-2 bg-accent-red rounded text-xs font-bold text-white">Confirm Out</button>
                </div>
              </div>
            </div>
          )}

          {/* BOWLER CHANGE MODAL */}
          {bowlerModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-graphite-900 border border-graphite-700 w-full max-w-sm rounded-2xl p-4 space-y-3">
                <h3 className="font-bold text-lime-400 text-base">Select Next Bowler</h3>
                <div className="space-y-1.5">
                  {match.teamB.players.map(p => (
                    <button key={p} onClick={() => {
                      setMatches(prev => prev.map(m => {
                        if (m.id !== activeMatchId) return m;
                        const clone = JSON.parse(JSON.stringify(m));
                        clone.innings[clone.currentInning - 1].currentBowler = p;
                        return clone;
                      }));
                      setBowlerModalOpen(false);
                    }} className="w-full p-2.5 text-left rounded-xl bg-graphite-800 hover:bg-graphite-700 text-xs text-white flex justify-between">
                      <span>{p}</span>
                      <span className="text-lime-400">Select →</span>
                    </button>
                  ))}
                </div>
                <button onClick={() => setBowlerModalOpen(false)} className="w-full py-2 bg-graphite-800 rounded text-xs text-gray-400 mt-2">Close</button>
              </div>
            </div>
          )}

          {/* FLOATING TOAST */}
          {toast && (
            <div className="fixed top-12 left-1/2 -translate-x-1/2 bg-lime-500 text-graphite-950 px-3 py-1.5 rounded-full text-xs font-bold shadow-lg animate-bounce z-50">
              ⚡ {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SixRushApp />);
  </script>
</body>
</html>
