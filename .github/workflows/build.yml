name: Build SixRush APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tools & Setup Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sixrush.cricketscorer",
            "appName": "SixRush",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: SixRush-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: SixRush-PlayStore-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
